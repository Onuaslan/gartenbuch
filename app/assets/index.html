<title>Gartenbuch Weikendorf</title>
<style>
/* Layout: one-hand phone app — tab views in a 560px column, fixed tab bar with raised camera button, bottom sheets for detail and forms */
:root{
  --ground:#EBF0E7; --surface:#FAFCF8; --surface-2:#DFE7DA; --line:#CCD7C6;
  --ink:#13241A; --ink-2:#4F6155; --ink-3:#7A8A7E;
  --leaf:#2D7A48; --leaf-ink:#FFFFFF; --leaf-soft:#D3E9D9;
  --water:#2869A8; --water-soft:#D9E8F5;
  --sun:#B07A0C; --warn-soft:#F5E8C8;
  --bad:#B0412D; --bad-soft:#F3DAD3;
  --bar:rgba(250,252,248,.92); --scrim:rgba(19,36,26,.42);
  --shadow:0 1px 2px rgba(19,36,26,.06),0 8px 24px rgba(19,36,26,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D1611; --surface:#152019; --surface-2:#1D2B23; --line:#2A3B31;
  --ink:#E2ECE4; --ink-2:#A2B4A7; --ink-3:#73867A;
  --leaf:#62C383; --leaf-ink:#0D1611; --leaf-soft:#1D3828;
  --water:#72B3EA; --water-soft:#172F45;
  --sun:#E3B14E; --warn-soft:#352B14;
  --bad:#EC8670; --bad-soft:#3B201A;
  --bar:rgba(21,32,25,.92); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0D1611; --surface:#152019; --surface-2:#1D2B23; --line:#2A3B31;
  --ink:#E2ECE4; --ink-2:#A2B4A7; --ink-3:#73867A;
  --leaf:#62C383; --leaf-ink:#0D1611; --leaf-soft:#1D3828;
  --water:#72B3EA; --water-soft:#172F45;
  --sun:#E3B14E; --warn-soft:#352B14;
  --bad:#EC8670; --bad-soft:#3B201A;
  --bar:rgba(21,32,25,.92); --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px}

/* type */
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.4vw,40px);line-height:1.02;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance;font-variation-settings:"opsz" 96}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head .count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}

/* weather strip */
.wx{background:var(--surface);border-radius:20px;padding:14px 10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.wx-now{display:flex;align-items:center;justify-content:space-between;padding:0 6px;gap:10px;flex-wrap:wrap}
.wx-now .t{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em}
.wx-cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wx-col{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 8px;border-radius:14px}
.wx-col.today{background:var(--leaf-soft)}
.wx-col .wd{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.wx-col.today .wd{color:var(--leaf);font-weight:500}
.wx-col svg.ic{width:22px;height:22px}
.wx-col .tmax,.wx-col .tmin{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.wx-col .tmin{color:var(--ink-3)}
.range{position:relative;width:6px;height:56px;border-radius:3px;background:var(--surface-2)}
.range i{position:absolute;left:0;right:0;border-radius:3px;background:linear-gradient(var(--sun),var(--water))}
.rain{display:flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.rain.wet{color:var(--water);font-weight:500}
.rain svg{width:9px;height:11px}
.stand{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);padding:0 6px}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--warn-soft)}
.alert.bad{background:var(--bad-soft)}
.alert.info{background:var(--water-soft)}
.alert svg{flex:none;width:22px;height:22px;margin-top:1px}
.alert b{display:block;font-weight:600}
.alert p{margin:2px 0 0;color:var(--ink-2);font-size:14px}

/* tasks */
.task{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.task .tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--water-soft);color:var(--water)}
.task .tile.chk{background:var(--bad-soft);color:var(--bad)}
.task .tile.obs{background:var(--warn-soft);color:var(--sun)}
.task .tile svg{width:22px;height:22px}
.task .body{min-width:0}
.task .name{font-weight:600}
.task .what{font-size:14px;color:var(--ink-2)}
.task .what .mono{color:var(--water);font-weight:500}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:42px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink)}
.btn.water{background:var(--water);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 13px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.empty-task{background:var(--surface);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;color:var(--ink-2);box-shadow:var(--shadow)}
.empty-task svg{width:26px;height:26px;color:var(--leaf);flex:none}

.week{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.week-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.week-row:first-child{border-top:0}
.week-row .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:2px;text-transform:uppercase;letter-spacing:.04em}
.week-row ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.week-row li{display:flex;justify-content:space-between;gap:10px}
.week-row li .mono{color:var(--water);font-size:13px;white-space:nowrap}

/* plants */
.area-head{display:flex;align-items:center;gap:10px}
.area-head .gl{width:26px;height:26px;color:var(--leaf)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:60px minmax(0,1fr) 30px;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:18px;padding:10px 12px 10px 10px;text-align:left;box-shadow:var(--shadow);width:100%}
.thumb{width:60px;height:60px;border-radius:14px;overflow:hidden;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:34px;height:34px}
.prow .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .meta{font-size:13px;color:var(--ink-3)}
.prow .rec{font-size:13px;font-weight:500;color:var(--ink-2)}
.prow .rec.due{color:var(--water)}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.gut{background:var(--leaf-soft);color:var(--leaf)}
.pill.beobachten{background:var(--warn-soft);color:var(--sun)}
.pill.krank{background:var(--bad-soft);color:var(--bad)}
.pill.ex{border:1px dashed var(--ink-3);color:var(--ink-3)}
.tube{justify-self:end;display:flex;flex-direction:column;align-items:center;gap:4px}
.tube .glass{position:relative;width:10px;height:44px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.tube .glass i{position:absolute;left:0;right:0;bottom:0;background:var(--water);border-radius:5px}
.tube .glass i.low{background:var(--sun)}
.tube span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.add-row{display:flex;gap:8px;flex-wrap:wrap}

.empty{background:var(--surface);border-radius:20px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:var(--shadow)}
.empty svg{width:56px;height:56px;color:var(--leaf)}

/* photo */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:250px;border-radius:24px;border:2px dashed var(--line);background:var(--surface);text-align:center;padding:24px;cursor:pointer}
.drop:hover{border-color:var(--leaf)}
.drop .cam{width:72px;height:72px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center}
.drop .cam svg{width:32px;height:32px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tip{background:var(--surface);border-radius:14px;padding:10px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.tip svg{width:20px;height:20px;color:var(--leaf)}
.preview{position:relative;border-radius:22px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.preview .swap{position:absolute;right:10px;bottom:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:44px}
.field textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.busy{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.leafspin{width:36px;height:36px;color:var(--leaf);animation:sway 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.result{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.result .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.result .art{font-size:13px;color:var(--ink-2)}
.result h2{font-size:22px}
.result ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.result li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.result li .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center}
.result .cause li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin:8px 0 0 8px}
.waterbox{display:flex;gap:10px;align-items:flex-start;background:var(--water-soft);border-radius:14px;padding:12px}
.waterbox svg{width:20px;height:20px;color:var(--water);flex:none;margin-top:1px}
.conf{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.err{background:var(--bad-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}

/* calendar */
.month{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.month.now{outline:2px solid var(--leaf);outline-offset:-2px}
.month .mh{display:flex;justify-content:space-between;align-items:baseline}
.month .tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--leaf)}
.cal-g{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.cal-g svg{width:22px;height:22px;color:var(--leaf);margin-top:1px}
.cal-g b{display:block;font-size:13px;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.cal-g p{margin:2px 0 0}
details.year{background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
details.year summary{padding:16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.year summary::-webkit-details-marker{display:none}
details.year[open] summary svg{transform:rotate(180deg)}
details.year summary svg{width:20px;height:20px;transition:transform .2s}
.year-list{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.year-list .ym{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.year-list .ym h3{font-size:15px}
.year-list .ym p{margin:0;font-size:14px;color:var(--ink-2)}
.year-list .ym p b{color:var(--ink);font-weight:600}

/* weather tab */
.wtable{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow-x:auto}
.wtable table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:330px}
.wtable th,.wtable td{padding:11px 10px;text-align:right;border-top:1px solid var(--line);font-size:14px}
.wtable th{font-family:var(--f-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border-top:0}
.wtable td:first-child,.wtable th:first-child{text-align:left}
.wtable td.wet{color:var(--water);font-weight:600}
.wtable tr.today td{background:var(--leaf-soft)}
.how{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.how p{margin:0;color:var(--ink-2);font-size:14px}
.how .f{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;color:var(--ink);overflow-x:auto;white-space:nowrap}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px 6px 8px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;padding:6px 0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--leaf)}
.tab.cam .ring{width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(45,122,72,.35);border:4px solid var(--ground)}
.tab.cam .ring svg{width:26px;height:26px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet .panel{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--ground);border-radius:24px 24px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.close svg{width:18px;height:18px}
.hero-photo{border-radius:20px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero-photo svg{width:72px;height:72px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface);border-radius:14px;padding:10px 12px}
.fact .k{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.fact .v{font-weight:600;margin-top:2px}
.recbox{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.recbox .bigtube{position:relative;width:16px;height:64px;border-radius:8px;background:var(--surface-2);overflow:hidden;flex:none}
.recbox .bigtube i{position:absolute;left:0;right:0;bottom:0;background:var(--water)}
.recbox .bigtube i.low{background:var(--sun)}
.recbox .r1{font-family:var(--f-display);font-weight:700;font-size:18px}
.hist{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.hist .h{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.hist .h:first-child{border-top:0}
.hist .h .d{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:1px}
.hist .h img{width:56px;height:56px;border-radius:10px;object-fit:cover;margin-top:6px;display:block}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

.banner{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:9px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:380px){.tips{grid-template-columns:1fr}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* onboarding */
.onb{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.onb .mark{width:72px;height:72px;border-radius:22px;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center}
.onb .mark svg{width:46px;height:46px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}

/* ---------- Start-Animation ---------- */
#splash{position:fixed;inset:0;z-index:9999;background:var(--ground);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s;color:var(--ink)}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(-4vh)}
#splash svg{width:132px;height:132px;overflow:visible}
#splash .sp-ground{fill:none;stroke:var(--ink-2);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:70;stroke-dashoffset:70;animation:spDraw .55s .1s cubic-bezier(.3,.7,.2,1) forwards;opacity:.55}
#splash .sp-stem{fill:none;stroke:var(--leaf);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:60;animation:spDraw .6s .5s cubic-bezier(.3,.7,.2,1) forwards}
#splash .sp-leaf{fill:var(--leaf);transform-box:fill-box;transform:scale(0) rotate(-14deg);animation:spLeaf .55s cubic-bezier(.3,1.5,.5,1) forwards}
#splash .sp-l1{transform-origin:100% 100%;animation-delay:.95s}
#splash .sp-l2{transform-origin:0% 100%;animation-delay:1.1s;opacity:.88}
#splash .sp-l3{transform-origin:50% 100%;animation-delay:1.25s;opacity:.7}
#splash .sp-dot{fill:var(--water);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spLeaf .45s 1.5s cubic-bezier(.3,1.7,.5,1) forwards}
#splash .sp-name{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1;opacity:0;transform:translateY(10px);animation:spUp .6s 1.2s cubic-bezier(.2,.8,.2,1) forwards;font-variation-settings:"opsz" 96}
#splash .sp-sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);opacity:0;animation:spUp .6s 1.45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spLeaf{to{transform:scale(1) rotate(0)}}
@keyframes spUp{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .sp-ground,#splash .sp-stem,#splash .sp-leaf,#splash .sp-dot,#splash .sp-name,#splash .sp-sub{animation-duration:.01s;animation-delay:0s}}

];

const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = String(k).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const todayKey = () => keyOf(new Date());
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const nf1 = new Intl.NumberFormat("de-AT",{maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat("de-AT",{maximumFractionDigits:0});
const fmtL = l => l < 10 ? nf1.format(Math.max(.1, Math.round(l*10)/10)) + " l" : l < 100 ? nf0.format(Math.round(l)) + " l" : nf0.format(Math.round(l/10)*10) + " l";
const fmtDate = k => { const d = parseKey(k); return `${d.getDate()}. ${MON[d.getMonth()].slice(0,3)}.`; };
const relDay = k => { const n = diffDays(todayKey(), k); return n === 0 ? "Heute" : n === 1 ? "Morgen" : n === -1 ? "Gestern" : WDL[parseKey(k).getDay()]; };
const str = v => (v == null ? "" : String(v)).trim();
const arr = v => Array.isArray(v) ? v : [];
function ra(date){
  const s = new Date(date.getFullYear(),0,0), J = Math.floor((date - s)/864e5), phi = LATV*Math.PI/180;
  const dr = 1 + .033*Math.cos(2*Math.PI*J/365), dl = .409*Math.sin(2*Math.PI*J/365 - 1.39);
  const ws = Math.acos(clamp(-Math.tan(phi)*Math.tan(dl), -1, 1));
  return 24*60/Math.PI*.082*dr*(ws*Math.sin(phi)*Math.sin(dl) + Math.cos(phi)*Math.cos(dl)*Math.sin(ws));
}
function et0(d){ const t = (d.max + d.min)/2; return Math.max(.2, .0023*.408*ra(parseKey(d.date))*(t+17.8)*Math.sqrt(Math.max(0, d.max - d.min))); }
let WX = [];
let LATV = 48;
function setWeather(days, latv){
  LATV = +latv || 48;
  const ds = (Array.isArray(days) ? days : []).filter(d => d && d.date && isFinite(d.max) && isFinite(d.min)).slice();
  ds.sort((a,b) => a.date < b.date ? -1 : 1);
  WX = ds.map(d => ({...d, rainChance: +d.rainChance || 0, et0: et0(d), rain: (+d.rainChance || 0)/100*5}));
}
function dayW(k){
  const d = WX.find(x => x.date === k); if (d) return d;
  const m = new Date().getMonth(), base = [.5,.8,1.5,2.5,3.5,4.5,5,4.2,2.8,1.6,.8,.5][m];
  if (!WX.length) return {et0: base, rain:.6, rainChance:12};
  if (k < WX[0].date) return {et0: WX[0].et0, rain:0, rainChance:0};
  const l = WX[WX.length-1]; return {et0: l.et0, rain:.5, rainChance:10};
}
const potVol = dcm => Math.PI*(dcm/20)**2*(.9*dcm/10);
function model(p){
  const kind = KINDS[p.kind] || KINDS.stauden, area = AREAS[p.area] || AREAS.beet, sunf = (SUN[p.sun] || SUN.voll).f, today = todayKey();
  if (area.indoor || kind.interval){
    const interval = Math.round((kind.interval || 7) * (p.sun === "voll" ? .8 : p.sun === "schatten" ? 1.3 : 1));
    const since = p.lastWatered ? Math.max(0, diffDays(p.lastWatered, today)) : Math.round(interval/2);
    const due = Math.max(0, interval - since);
    return {fill: clamp(1 - since/interval), due: due <= 6 ? due : null, amountL: potVol(+p.size || 20)*.15, perM2:null, indoor:true, pot:true, interval};
  }
  let raw, loss, gain, A;
  const pot = !!area.pot;
  if (pot){ const d = +p.size || 30; A = Math.PI*(d/200)**2; raw = potVol(d)*.15; loss = w => w.et0*kind.kc*sunf*A*3.5; gain = w => w.rain*A*.7; }
  else { A = Math.max(.1, +p.size || 1); raw = kind.raw; loss = w => w.et0*kind.kc*sunf; gain = w => w.rain; }
  let d = 0, k = addDays(p.lastWatered || addDays(today,-3), 1), guard = 0;
  while (k <= today && guard++ < 90){ const w = dayW(k); d = Math.max(0, d + loss(w) - gain(w)); k = addDays(k,1); }
  const dNow = d; let due = dNow >= raw*.9 ? 0 : null, dDue = dNow;
  for (let i = 1; i <= 6 && due === null; i++){ const w = dayW(addDays(today,i)); d = Math.max(0, d + loss(w) - gain(w)); if (d >= raw*.9){ due = i; dDue = d; } }
  let amountL, perM2 = null;
  if (pot) amountL = Math.max(dDue, raw*.6);
  else { let mm = Math.max(dDue, kind.min || raw*.7); if (kind.max) mm = Math.min(mm, kind.max); perM2 = mm; amountL = mm*A; }
  return {fill: clamp(1 - dNow/raw), due, amountL, perM2, pot, area: A};
}
function recText(m){
  if (m.due === 0) return "Heute gießen";
  if (m.due === 1) return "Morgen gießen";
  if (m.due != null) return "Am " + WDL[parseKey(addDays(todayKey(), m.due)).getDay()] + " gießen";
  return "Diese Woche nicht nötig";
}
const amountText = m => m.perM2 ? `${fmtL(m.amountL)} · ${nf0.format(Math.round(m.perM2))} l/m²` : `≈ ${fmtL(m.amountL)}`;
const cans = l => Math.max(1, Math.round(l/10*2)/2);
const cansText = l => { const c = cans(l); return `${nf1.format(c)} ${c === 1 ? "Gießkanne" : "Gießkannen"} à 10 l`; };

/* ---------- garden knowledge (shared by app and morning summary) ---------- */
const isLawn = p => p.area === "rasen" || p.kind === "rasen";
const ZEHRER = {tomate:"stark", paprika:"stark", gurke:"stark", kohl:"stark", salat:"mittel", wurzel:"mittel", kraeuter:"schwach"};
const ZEHRER_LABEL = {stark:"Starkzehrer", mittel:"Mittelzehrer", schwach:"Schwachzehrer"};
const NEXT_YEAR = {
  stark: "Mittelzehrer: Salat, Spinat, Karotten, Kohlrabi, Zwiebeln oder Rote Rüben.",
  mittel: "Schwachzehrer: Erbsen, Bohnen, Radieschen, Kräuter – oder eine Gründüngung wie Phacelia.",
  schwach: "Starkzehrer: Tomaten, Gurken, Zucchini, Kürbis oder Kohl. Vorher 3–5 Liter reifen Kompost pro m² einarbeiten."
};
const MIX = {
  tomate:  {gut:["Basilikum","Petersilie","Karotten","Salat","Spinat","Kohl","Ringelblumen"], schlecht:["Kartoffeln","Gurken","Erbsen","Fenchel"], pause:"Tomaten nicht zwei Jahre hintereinander an denselben Platz – die Braunfäule überdauert im Boden."},
  paprika: {gut:["Tomaten","Karotten","Basilikum","Zwiebeln"], schlecht:["Erbsen","Fenchel","Bohnen"], pause:"Danach 3 Jahre keine Nachtschattengewächse (Tomate, Paprika, Kartoffel, Melanzani) an dieselbe Stelle."},
  gurke:   {gut:["Salat","Dill","Zwiebeln","Kohl","Bohnen"], schlecht:["Tomaten","Kartoffeln","Radieschen"], pause:"Gurken und Zucchini 3 Jahre Pause am selben Platz."},
  salat:   {gut:["Karotten","Radieschen","Kohl","Tomaten","Gurken","Erdbeeren","Zwiebeln"], schlecht:["Petersilie","Sellerie"], pause:"Salat ist unkompliziert – trotzdem jedes Jahr den Platz wechseln."},
  kohl:    {gut:["Tomaten","Salat","Sellerie","Spinat","Dill"], schlecht:["Erdbeeren","Zwiebeln","Knoblauch"], pause:"Kohl mindestens 4 Jahre Pause am selben Platz, sonst droht Kohlhernie."},
  wurzel:  {gut:["Zwiebeln","Lauch","Salat","Tomaten","Dill"], schlecht:["Rote Rüben"], pause:"Wurzelgemüse 3 Jahre Pause am selben Platz."},

const MIX_KEY = {tomate:"Tomaten", paprika:"Paprika", gurke:"Gurken", salat:"Salat", kohl:"Kohl", wurzel:"Karotten", kraeuter:"Basilikum"};
const HARVEST_KINDS = ["tomate","paprika","gurke","salat","kohl","wurzel","kraeuter","gehoelz","kuebel"];

const isBed = p => p.area === "beet" || !!ZEHRER[p.kind] && p.area !== "kuebel" && p.area !== "zimmer";
function badPairs(plants){
  const beds = plants.filter(isBed), out = [];
  for (let i = 0; i < beds.length; i++) for (let j = i+1; j < beds.length; j++){
    const a = beds[i], b = beds[j], ma = MIX[a.kind], mb = MIX[b.kind];

}

/* Weather-based disease warnings – only for plants that exist */
function diseaseWarnings(plants, today){
  const next = WX.filter(d => d.date >= today).slice(0,7), m = parseKey(today).getMonth() + 1, out = [];
  if (!next.length || !plants.length) return out;
  const of = (...kinds) => plants.filter(p => kinds.includes(p.kind));
  const wet = next.filter(d => d.rainChance >= 50), warmWet = wet.filter(d => d.max >= 15);
  const tom = of("tomate");
  if (tom.length && m >= 6 && m <= 10 && warmWet.length >= 2) out.push({level:"bad", plants: tom, title:"Braunfäule-Gefahr bei Tomaten",
    text:`${warmWet.length} feucht-warme Tage in Sicht. Untere Blätter bis 30 cm Höhe abschneiden, nur von unten an den Stängel gießen und ein Regendach oder eine Folienhaube aufstellen. Braune Flecken? Befallene Blätter sofort in den Restmüll, nicht auf den Kompost.`});
  const snail = plants.filter(p => ["salat","kohl","gurke","stauden","kraeuter"].includes(p.kind) && !(AREAS[p.area]||{}).indoor);
  if (snail.length && m >= 4 && m <= 10 && wet.length && wet.some(d => d.min >= 5)) out.push({level:"warn", plants: snail, title:"Schnecken-Wetter",

  const mildew = of("gurke","rose"), dryWarm = next.filter(d => d.max >= 24 && d.rainChance < 30);

    text:"Warm-trockene Tage mit kühlen Nächten. Auf weißen, abwischbaren Belag auf den Blättern achten. Vorbeugend morgens und nur auf den Boden gießen. Bei ersten Flecken befallene Blätter entfernen und Netzschwefel (z. B. Neudorff Netz-Schwefelit) laut Packung spritzen."});
  const lawn = plants.filter(isLawn);

    text:"Nasskaltes Wetter. Laub sofort abrechen, nicht mehr mit Stickstoff düngen und den nassen Rasen nicht betreten. Graue, runde Flecken? Mit dem Rechen auflockern, im Frühjahr nachsäen."});
  const indoor = plants.filter(p => (AREAS[p.area]||{}).indoor);
  if (indoor.length && (m >= 11 || m <= 2)) out.push({level:"warn", plants: indoor, title:"Heizungsluft: Zeit für Spinnmilben",
    text:"Blattunterseiten genau ansehen: feine Gespinste oder helle Pünktchen? Pflanze lauwarm abduschen und eine Schale Wasser neben die Heizung stellen. Hartnäckig: Rapsöl-Präparat (z. B. Neudorff Spruzit, Celaflor Naturen) laut Packung."});
  return out;
}

/* Text for the morning push notification */
function dailySummary(plants, today, shopOpen){
  const d = parseKey(today), lines = [`Gartenbuch · ${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`];
  const due = plants.map(p => ({p, m: model(p)})).filter(x => x.m.due === 0);
  lines.push(due.length ? "Gießen: " + due.map(({p,m}) => `${p.name} ${amountText(m)}`).join(" · ") : "Heute muss nichts gegossen werden.");
  const next = WX.filter(x => x.date >= today).slice(0,4);
  const outdoor = plants.filter(p => !(AREAS[p.area]||{}).indoor), pots = plants.filter(p => p.area === "kuebel"), ground = plants.filter(p => (AREAS[p.area]||{}).ground);
  const frost = next.find(x => x.min <= 2);
  if (frost && outdoor.length) lines.push(`Frost ${relDay(frost.date).toLowerCase() === "heute" ? "heute Nacht" : relDay(frost.date)}: ${nf1.format(frost.min)} °C${pots.length ? ` – ${pots.map(p => p.name).join(", ")} reinstellen` : ""}${plants.some(p => p.area === "beet") ? ", Beet mit Vlies abdecken" : ""}.`);
  const wet = next.find(x => x.rainChance >= 50 && x.date > today);
  if (wet && ground.length) lines.push(`${relDay(wet.date)} ${wet.rainChance} % Regen – Beet und Rasen können warten.`);
  diseaseWarnings(plants, today).forEach(w => lines.push(`${w.title}: ${w.plants.map(p => p.name).join(", ")}`));
  const sick = plants.filter(p => p.status === "krank");
  if (sick.length) lines.push(`Behandeln: ${sick.map(p => p.name).join(", ")}`);
  if (shopOpen) lines.push(`Einkaufsliste: ${shopOpen} offen`);
  return lines.join("\n");
}

/* Beginner step-by-step watering instructions */
function howToWater(p, m){
  const area = AREAS[p.area] || AREAS.beet, rainSoon = WX.slice(1,3).find(d => d.rainChance >= 50);
  if (p.area === "rasen" || p.kind === "rasen"){
    const mm = Math.round(m.perM2 || 12), cm = nf1.format(mm/10);
    return [
      `Am besten früh morgens gießen (5–9 Uhr). Dann verdunstet wenig, und das Gras ist bis zum Abend wieder trocken – das schützt vor Pilzkrankheiten.`,
      `Ziel: <b>${mm} Liter pro m²</b>. Für ${nf0.format(+p.size || 0)} m² sind das zusammen etwa <b>${fmtL(m.amountL)}</b>.`,
      `So misst du es ohne Messgerät: Stell 2–3 leere Konservendosen auf den Rasen und schalte den Rasensprenger ein. Steht in den Dosen etwa <b>${cm} cm</b> Wasser, ist es genug. Merk dir die Dauer – nächstes Mal reicht der Timer.`,
      `Lieber selten und viel als täglich ein bisschen. Dann wachsen die Wurzeln tief, und der Rasen übersteht Trockenheit besser.`,
      ...(rainSoon ? [`${relDay(rainSoon.date)} ist Regen möglich (${rainSoon.rainChance} %). Fällt er kräftig aus, kannst du dir das Gießen sparen.`] : [])
    ];
  }
  if (area.indoor) return [
    `Fingerprobe: Steck einen Finger 2 cm tief in die Erde. Ist sie dort noch feucht, warte 2–3 Tage und prüfe erneut.`,
    `Ist sie trocken: Gib etwa <b>${fmtL(m.amountL)}</b> zimmerwarmes Wasser (ein Wasserglas ≈ 0,25 l) langsam rundum auf die Erde.`,
    `Hör auf, wenn unten im Übertopf Wasser ankommt. Nach 15 Minuten den Übertopf ausleeren – stehendes Wasser lässt die Wurzeln faulen.`,
    `Im Winter brauchen die meisten Zimmerpflanzen deutlich weniger Wasser, obwohl die Heizungsluft trocken ist.`
  ];
  if (area.pot) return [
    `Fingerprobe: Finger 2–3 cm tief in die Erde. Nur gießen, wenn es dort trocken ist.`,
    `Langsam etwa <b>${fmtL(m.amountL)}</b> direkt auf die Erde gießen, nicht über die Blätter.`,
    `Gieß so lange, bis unten aus dem Abzugsloch Wasser kommt – dann ist der ganze Wurzelballen nass.`,
    `Nach 15 Minuten den Untersetzer ausleeren. Staunässe ist für Kübelpflanzen gefährlicher als Trockenheit.`,
    `Im Herbst und Winter deutlich weniger gießen. Im Winterquartier nur, wenn die Erde oben trocken ist.`
  ];
  return [
    `Früh morgens oder am Abend gießen, nicht in der Mittagssonne.`,
    `Menge: <b>${fmtL(m.amountL)}</b> für ${nf1.format(+p.size || 0)} m² – das sind ungefähr <b>${cansText(m.amountL)}</b>.`,
    `Direkt auf den Boden an den Stängelfuß gießen, nicht über die Blätter. Nasse Blätter fördern Pilzkrankheiten, bei Tomaten vor allem die Braunfäule.`,
    `In 2–3 Runden gießen: erst die Hälfte, 10 Minuten warten, dann den Rest. So versickert das Wasser, statt abzurinnen.`,
    `Vorher Fingerprobe: 3 cm tief noch feucht? Dann einen Tag warten.`,
    ...(rainSoon ? [`${relDay(rainSoon.date)} ist Regen möglich (${rainSoon.rainChance} %). Bei kräftigem Regen kannst du das Gießen auslassen.`] : [])
  ];
}
const howHTML = (p, m, open=false) => `<details class="howto" ${open ? "open" : ""}><summary>So gießt du richtig ${I.down}</summary><ol class="howlist">${howToWater(p,m).map(s => `<li><span>${s}</span></li>`).join("")}</ol></details>`;

/* ---------- data layer ---------- */
function localSave(){ store.set("garten.plants", S.plants); }
async function addPlant(data){
  if (S.mode === "db"){ const ref = S.db.collection("plants").doc(); await ref.set(data); return ref.id; }
  const id = "p" + Date.now().toString(36); S.plants.push({id, ...data}); localSave(); render(); return id;
}
async function updatePlant(id, patch){
  if (S.mode === "db") return S.db.collection("plants").doc(id).update(patch);
  const p = S.plants.find(x => x.id === id); if (p) Object.assign(p, patch); localSave(); render();
}
async function deletePlant(id){
  if (S.mode === "db") return S.db.collection("plants").doc(id).delete();
  S.plants = S.plants.filter(x => x.id !== id); localSave(); render();
}
const plantById = id => S.plants.find(p => p.id === id);
function withHistory(p, entry){ const h = Array.isArray(p.history) ? p.history.slice() : []; h.unshift(entry); return h.slice(0, 30); }

async function waterNow(id){
  const p = plantById(id); if (!p) return;
  const m = model(p);
  try {
    await updatePlant(id, {lastWatered: todayKey(), history: withHistory(p, {date: todayKey(), type:"wasser", text:`Gegossen${m.indoor ? "" : " · " + amountText(m)}`})});
    toast(`${p.name}: gegossen`);
  } catch { toast("Speichern hat nicht geklappt. Bitte nochmal tippen."); }
}
async function rainedToday(){
  const t = todayKey(), list = S.plants.filter(p => !(AREAS[p.area]||{}).indoor && p.lastWatered !== t);
  for (const p of list){ try { await updatePlant(p.id, {lastWatered: t, history: withHistory(p, {date:t, type:"regen", text:"Kräftiger Regen – zählt als gegossen"})}); } catch {} }
  S.rainConfirm = false; toast(`${list.length} Außenpflanzen als gegossen markiert`); render();
}

/* ---------- location ---------- */
async function saveLocation(address){
  address = str(address).replace(/\s+/g, " ");
  if (address.length < 4 || !/[A-Za-zÄÖÜäöüß]/.test(address)){ S.locErr = "Bitte gib mindestens Postleitzahl und Ort ein, z. B. „2253 Weikendorf“."; render(); renderSheet(); return false; }
  S.locBusy = true; S.locErr = ""; render(); renderSheet();
  const doc = {address, status:"pending", statusText:"", requestedAt: new Date().toISOString()};
  try {
    if (S.mode === "db") await S.db.doc("settings/location").set(doc);
    else { S.loc = doc; store.set("garten.loc", doc); }
  } catch { S.locBusy = false; S.locErr = "Speichern hat nicht geklappt. Prüfe die Internetverbindung und versuch es nochmal."; render(); renderSheet(); return false; }
  S.locBusy = false;
  requestWeather();
  return true;
}
async function requestWeather(){
  S.fireNote = "";
  if (S.mode !== "db"){ await loadWeatherOM(); return; }
  if (!S.mcp){ S.fireNote = "Das Wetter wird beim nächsten automatischen Update (täglich um 5:45 Uhr) geladen."; render(); return; }
  try {
    await S.mcp.callTool("Claude Code Remote", "fire_trigger", {trigger_id: WEATHER_TASK, text: "Die Adresse wurde gerade in der App eingegeben oder geändert. Bitte jetzt ausführen."}, {cache:false});
  } catch(e){
    const c = e && e.code;
    S.fireNote = c === "approval_required" || c === "not_in_manifest"
      ? "Die App durfte die Wettersuche nicht starten. Sie läuft trotzdem automatisch jeden Morgen um 5:45 Uhr."
      : c === "server_not_connected" || c === "needs_reauth"
      ? "Die Wettersuche ließ sich gerade nicht starten. Sie läuft automatisch jeden Morgen um 5:45 Uhr."
      : "Die Wettersuche ließ sich gerade nicht starten. Tippe später auf „Wetter jetzt aktualisieren“ oder warte auf das Update um 5:45 Uhr.";
  }
  render();
}

const wxIcon = d => d.rainChance >= 50 ? I.rain : d.rainChance >= 25 ? I.cloud : I.sun;
function locStatus(){
  const L = S.loc; if (!L) return "";
  if (L.status === "error") return `<div class="statusbar err"><span style="color:var(--bad);flex:none">${I.pin}</span><div style="flex:1;min-width:0"><b>Adresse nicht gefunden</b><p>${esc(L.statusText || "Bitte genauer eingeben, mit Postleitzahl und Ort.")}</p></div><button class="btn sm" data-act="loc-edit">Ändern</button></div>`;

  return "";
}
function weatherStrip(){
  const t = todayKey(), ds = WX.filter(d => d.date >= t).slice(0,7);
  if (!ds.length) return locStatus();
  const lo = Math.min(...ds.map(d => d.min)), hi = Math.max(...ds.map(d => d.max)), span = Math.max(1, hi - lo), H = 56;
  const cols = ds.map(d => {
    const top = (hi - d.max)/span*H, h = Math.max(4, (d.max - d.min)/span*H);
    return `<div class="wx-col ${d.date === t ? "today" : ""}">
      <span class="wd">${d.date === t ? "Heute" : WD[parseKey(d.date).getDay()]}</span>
      <span style="color:${d.rainChance >= 50 ? "var(--water)" : d.rainChance >= 25 ? "var(--ink-2)" : "var(--sun)"}">${wxIcon(d).replace("<svg", '<svg class="ic"')}</span>
      <span class="tmax">${Math.round(d.max)}°</span>
      <div class="range"><i style="top:${top.toFixed(1)}px;height:${h.toFixed(1)}px"></i></div>
      <span class="tmin">${Math.round(d.min)}°</span>
      <span class="rain ${d.rainChance >= 50 ? "wet" : ""}">${I.drop}${d.rainChance}%</span>
    </div>`;
  }).join("");
  const st = new Date(S.weather.stand), now = S.weather.now;
  const stale = WX.length && WX[WX.length-1].date < addDays(t, 2);
  return `<div class="wx">
    <div class="wx-now">${now && isFinite(now.temp) ? `<span class="t">${nf1.format(now.temp)} °C</span><span class="muted small">${esc(now.cond || "")} · beim letzten Update</span>` : ""}</div>
    <div class="wx-cols">${cols}</div>
    <div class="stand">${isNaN(st) ? "" : `Prognose vom ${st.getDate()}.${st.getMonth()+1}., ${pad(st.getHours())}:${pad(st.getMinutes())} Uhr`}${stale ? " · wird bald aktualisiert" : ""}</div>
  </div>`;
}
function alerts(){
  const t = todayKey(), next = WX.filter(d => d.date >= t).slice(0,7), out = [];
  const outdoor = S.plants.filter(p => !(AREAS[p.area]||{}).indoor);
  const pots = S.plants.filter(p => p.area === "kuebel"), beds = S.plants.filter(p => p.area === "beet"), zier = S.plants.filter(p => p.area === "zier");
  const lawn = S.plants.filter(isLawn), ground = S.plants.filter(p => (AREAS[p.area]||{}).ground);
  const names = l => l.map(p => esc(p.name)).join(", ");
  const frost = next.find(d => d.min <= 2);
  if (frost && outdoor.length){
    const tips = [];
    if (pots.length) tips.push(`<b>${names(pots)}</b>: am Vortag ins Haus oder in die Garage stellen, falls frostempfindlich.`);
    if (beds.length) tips.push(`<b>${names(beds)}</b>: mit Gartenvlies abdecken, die Ränder mit Steinen beschweren.`);
    if (zier.length) tips.push(`<b>${names(zier)}</b>: Empfindliche mit Vlies oder Reisig schützen.`);
    if (lawn.length) tips.push(`<b>${names(lawn)}</b>: bei Raureif nicht betreten.`);
    out.push(`<div class="alert bad" style="color:var(--bad)">${I.frost}<div style="color:var(--ink)"><b>Frost möglich: ${relDay(frost.date)} (${nf1.format(frost.min)} °C)</b>${tips.map(x => `<p>${x}</p>`).join("")}</div></div>`);
  } else if (pots.length){
    const cold = next.filter(d => d.min <= 5);
    if (cold.length) out.push(`<div class="alert" style="color:var(--sun)">${I.frost}<div style="color:var(--ink)"><b>Kühle Nächte um ${nf0.format(Math.min(...cold.map(d=>d.min)))} °C</b><p>Noch kein Frost. Plane schon jetzt, wo <b>${names(pots)}</b> überwintern, falls frostempfindlich: hell und kühl (5–10 °C) ist ideal, zum Beispiel ein Stiegenhaus oder eine helle Garage.</p></div></div>`);
  }
  const wet = next.find(d => d.rainChance >= 50);
  if (wet && ground.length) out.push(`<div class="alert info" style="color:var(--water)">${I.rain}<div style="color:var(--ink)"><b>${relDay(wet.date)}: ${wet.rainChance} % Regenwahrscheinlichkeit</b><p>Für <b>${names(ground)}</b> lohnt es sich, den Regen abzuwarten.${pots.length ? " Kübel unter einem Dach bekommen davon nichts ab." : ""}</p></div></div>`);
  diseaseWarnings(S.plants, t).forEach(w => out.push(`<div class="alert ${w.level === "bad" ? "bad" : ""}" style="color:var(${w.level === "bad" ? "--bad" : "--sun"})">${I.bug}<div style="color:var(--ink)"><b>${esc(w.title)}</b><p><b>${names(w.plants)}</b>: ${esc(w.text)}</p></div></div>`));
  return out.join("");
}

  ${shopOpen().length ? `<button class="linkcard" data-act="shop"><span class="ico">${I.cart}</span><span class="t"><b>Einkaufsliste</b><span>${shopOpen().length} ${shopOpen().length === 1 ? "Produkt" : "Produkte"} offen: ${esc(shopOpen().slice(0,3).map(x => x.text).join(", "))}${shopOpen().length > 3 ? " …" : ""}</span></span>${I.chev}</button>` : ""}

Erstelle einen vollständigen Pflegeplan. Regeln:
- Nenne konkrete Produkte, die in Österreich in Gartencentern und Baumärkten (Bellaflora, Hornbach, OBI, Bauhaus, Lagerhaus) üblich sind: immer den Produkttyp plus 1–2 Beispielmarken (z. B. Neudorff, Compo, Substral, Gardol, Ökohum, Wolf-Garten, Cuxin). Bevorzuge torffreie Erden und organische oder organisch-mineralische Dünger.
- Rechne alle Mengen für GENAU diese Größe aus (Gramm, Liter, Säcke, Esslöffel ≈ 15 g, Handvoll ≈ 30–40 g, Gießkanne = 10 l) und nenne zusätzlich die Faustregel pro m² bzw. pro Liter Gießwasser.

function cleanPlan(r){
  if (!r || typeof r !== "object") return null;
  const e = r.erde && typeof r.erde === "object" ? r.erde : {};
  const plan = {
    kurz: str(r.kurz), jetzt: arr(r.jetzt).map(str).filter(Boolean).slice(0,5),
    erde: {empfehlung: str(e.empfehlung), produkt: str(e.produkt), menge: str(e.menge), schritte: arr(e.schritte).map(str).filter(Boolean).slice(0,5)},
    duengung: arr(r.duengung).filter(x => x && typeof x === "object").slice(0,5).map(x => ({wann:str(x.wann), produkt:str(x.produkt), menge:str(x.menge), wie:str(x.wie)})),
    jahresplan: arr(r.jahresplan).filter(x => x && typeof x === "object").slice(0,10).map(x => ({zeit:str(x.zeit), titel:str(x.titel), schritte: arr(x.schritte).map(str).filter(Boolean).slice(0,4)})),
    krankheiten: arr(r.krankheiten).filter(x => x && typeof x === "object").slice(0,5).map(x => ({name:str(x.name), erkennen:str(x.erkennen), vorbeugen:str(x.vorbeugen), mittel:str(x.mittel), menge:str(x.menge), anwendung:str(x.anwendung)})),
    ertrag: arr(r.ertrag).map(str).filter(Boolean).slice(0,6),
    erstellt: todayKey()
  };
  return plan.kurz || plan.duengung.length ? plan : null;
}
async function makePlan(id){
  const p = plantById(id); if (!p || !S.sample || S.plan.busy) return;
  S.plan = {busy:id, error:null, ctl:new AbortController(), started: Date.now()}; renderSheet();
  clearInterval(tick); tick = setInterval(() => { const e = document.getElementById("planElapsed"); if (e) e.textContent = Math.round((Date.now() - S.plan.started)/1000) + " s"; }, 1000);
  try {
    const r = await S.sample.json(planPrompt(p), {signal: S.plan.ctl.signal, modelTier:"default"});
    const plan = cleanPlan(r); if (!plan) throw {code:"invalid_json"};
    await updatePlant(id, {plan});
    toast("Pflegeplan gespeichert");
  } catch(e){
    const c = e && e.code;
    S.plan.error = c === "cancelled" ? null : c === "not_granted" ? "Der API-Schlüssel fehlt, wird abgelehnt oder das Guthaben ist aufgebraucht. Prüfe ihn in den Einstellungen."
      : c === "rate_limited" ? "Gerade zu viele Anfragen. Probier es in einer Minute nochmal." : c === "invalid_json" ? "Der Plan kam unvollständig an. Tippe nochmal auf „Erstellen“."
      : "Das hat nicht geklappt. Prüfe die Verbindung und versuch es nochmal.";
  } finally { clearInterval(tick); S.plan.busy = null; renderSheet(); }
}

/* ---------- photo + analysis ---------- */
function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => res({img, url}); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); }; img.src = url; });
}
function toBlob(img, max, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", q));
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function onPhoto(file){
  if (!file) return;
  try {
    const {img, url} = await loadImage(file);
    const blob = await toBlob(img, 1400, .86), thumb = await toBlob(img, 320, .72);
    URL.revokeObjectURL(url);
    Object.assign(S.photo, {blob, thumb, url: URL.createObjectURL(blob), result:null, error:null, saved:false, savedUrl:null});
    render();
  } catch { S.photo.error = "Das Bild ließ sich nicht öffnen. Versuch ein anderes Foto (JPEG oder HEIC vom iPhone)."; render(); }
}
async function persistPhoto(){
  const ph = S.photo; if (ph.savedUrl) return ph.savedUrl;
  if (S.assets){ try { const a = await S.assets.upload(ph.blob); ph.savedUrl = a.url; return a.url; } catch {} }
  ph.savedUrl = await blobToDataURL(ph.thumb); return ph.savedUrl;
}
function statusFromResult(r){
  const st = r.zustand === "krank" ? "krank" : r.zustand === "beobachten" ? "beobachten" : "gut";
  return {status: st, statusText: r.titel, statusDate: todayKey(), lastSteps: r.massnahmen.slice(0,6)};
}
function buildPrompt(){
  const p = plantById(S.photo.plantId), t = todayKey(), d = parseKey(t);
  const wx = WX.filter(x => x.date >= t).slice(0,5).map(x => `${relDay(x.date)}: ${Math.round(x.min)}–${Math.round(x.max)} °C, Regen ${x.rainChance} %`).join("; ");
  const ctx = p ? `Laut Besitzer ist das: „${p.name}“, ${(KINDS[p.kind]||{}).label}, Bereich ${(AREAS[p.area]||{}).label}, ${sizeText(p)}, ${(SUN[p.sun]||{}).label}${p.lastWatered ? `, zuletzt gegossen vor ${diffDays(p.lastWatered, t)} Tagen` : ""}.` : "Die Pflanze ist noch nicht erfasst – bestimme sie.";
  return `Du bist Gärtnermeister mit 25 Jahren Praxis in Österreich und Experte für Pflanzenschutz. Der Besitzer ist Anfänger ohne Vorkenntnisse.
Standort: ${place()}. Heute: ${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}. ${wx ? `Wetter nächste Tage: ${wx}.` : ""}
${ctx}
${S.photo.note ? `Beobachtung des Besitzers: ${S.photo.note}` : ""}

Analysiere das Foto: Art, Zustand, Krankheiten, Schädlinge, Nährstoffmangel, Gieß-, Sonnen- oder Frostschäden. Berücksichtige Jahreszeit und Wetter.
Für die Maßnahmen gilt:
- Jeder Schritt sagt WAS, WIE GENAU, WANN und WIE VIEL – so, dass ein Anfänger es sofort umsetzen kann.
- Wenn etwas gekauft werden muss: Produkttyp/Wirkstoff + 1–2 Beispielprodukte, die in Österreich in Gartencentern und Baumärkten (Bellaflora, Hornbach, OBI, Lagerhaus) erhältlich und für den Haus- und Kleingarten zugelassen sind (z. B. Neudorff, Compo, Substral, Celaflor, Cuxin). Zuerst mechanische oder biologische Lösungen.
- Menge konkret: Dosierung pro Liter Wasser bzw. pro m² und die Menge für diese Pflanze; Wiederholung (z. B. alle 7 Tage, 3×).

let tick;
async function analyze(){
  const ph = S.photo; if (!S.sample || !ph.blob || ph.busy) return;
  ph.busy = true; ph.error = null; ph.started = Date.now(); ph.ctl = new AbortController(); render();
  clearInterval(tick); tick = setInterval(() => { const e = document.getElementById("elapsed"); if (e) e.textContent = Math.round((Date.now() - ph.started)/1000) + " s"; }, 1000);
  try {
    const r = await S.sample.json(buildPrompt(), {images:[ph.blob], signal: ph.ctl.signal, modelTier:"default"});
    if (!r || typeof r !== "object" || !r.befund) throw {code:"invalid_json"};
    ph.result = {
      art: str(r.art), kategorie: str(r.kategorie), bereich: str(r.bereich), sicherheit: str(r.sicherheit), zustand: str(r.zustand),
      titel: str(r.titel) || str(r.art) || "Ergebnis", befund: str(r.befund), giessen: str(r.giessen), dringlichkeit: str(r.dringlichkeit),
      ursachen: arr(r.ursachen).map(str).filter(Boolean),
      massnahmen: arr(r.massnahmen).map(m => typeof m === "string" ? {schritt:m, wie:"", produkt:"", menge:""} : {schritt:str(m && m.schritt), wie:str(m && m.wie), produkt:str(m && m.produkt), menge:str(m && m.menge)}).filter(m => m.schritt),
      vorbeugen: arr(r.vorbeugen).map(str).filter(Boolean)
    };
  } catch(e){
    const c = e && e.code;
    ph.error = c === "cancelled" ? null
      : c === "not_granted" ? "Der API-Schlüssel fehlt, wird abgelehnt oder das Guthaben ist aufgebraucht. Prüfe ihn in den Einstellungen."
      : c === "rate_limited" ? "Gerade zu viele Anfragen. Probier es in einer Minute nochmal."
      : c === "invalid_json" ? "Die Antwort kam unvollständig an. Tippe nochmal auf Analysieren."
      : c === "image_rejected" ? "Das Foto wurde nicht angenommen. Versuch ein anderes Foto."
      : "Die Analyse hat nicht geklappt. Prüfe die Verbindung und versuch es nochmal.";
  } finally { ph.busy = false; clearInterval(tick); render(); }
}

/* ---------- Wetter über Open-Meteo (eigenständige Version) ---------- */
let wxCurrent = null;
const wxCond = c => c === 0 ? "Klar" : c <= 2 ? "Heiter" : c === 3 ? "Bedeckt" : (c === 45 || c === 48) ? "Nebel" : (c >= 51 && c <= 57) ? "Nieselregen" : (c >= 61 && c <= 67) ? "Regen" : (c >= 71 && c <= 77) ? "Schnee" : (c >= 80 && c <= 82) ? "Regenschauer" : (c === 85 || c === 86) ? "Schneeschauer" : c >= 95 ? "Gewitter" : "";
async function fetchJSON(url, ms){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 15000);
  try { const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) throw new Error("http " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const COUNTRY_WORD = /^(österreich|oesterreich|austria|deutschland|germany|schweiz|switzerland|türkei|türkiye|turkey|at|de|ch|tr)$/i;
function geoCandidates(address){
  const a = str(address).replace(/\s+/g, " ");
  const toks = a.replace(/[,;()]/g, " ").split(" ").map(w => w.replace(/^[-–.]+|[-–.]+$/g, "")).filter(w => w && !/\d/.test(w) && !COUNTRY_WORD.test(w));
  const names = [], add = n => { n = n.trim(); if (n.length >= 2 && !names.includes(n)) names.push(n); };
  add(toks.join(" "));
  for (let i = 1; i < Math.min(toks.length, 4); i++) add(toks.slice(i).join(" "));
  for (let n = toks.length - 1; n >= 1; n--) add(toks.slice(0, n).join(" "));
  toks.forEach(add);
  return names.slice(0, 8);
}
async function geocodeAddress(address){
  const a = str(address).replace(/\s+/g, " "), plz = (a.match(/\b\d{4,5}\b/) || [])[0] || "";
  for (const name of geoCandidates(a)){
    const j = await fetchJSON("https://geocoding-api.open-meteo.com/v1/search?count=10&language=de&format=json&name=" + encodeURIComponent(name));
    const rs = arr(j && j.results).filter(r => !/^(ADM|PCL|CONT|RGN|TERR)/.test(r.feature_code || "")); if (!rs.length) continue;
    return (plz && rs.find(r => arr(r.postcodes).includes(plz))) || rs.find(r => r.country_code === "AT") || rs[0];
  }
  return null;
}
function loadWeatherOM(quiet){
  if (wxCurrent) return wxCurrent;
  if (!S.loc || !S.loc.address) return Promise.resolve();
  wxCurrent = fetchWeatherOM(quiet).catch(() => {}).then(() => { wxCurrent = null; });
  return wxCurrent;
}
async function fetchWeatherOM(quiet){
  const addr = S.loc.address;
  try {
    let lat = +S.loc.lat, lon = +S.loc.lon, label = S.loc.label;
    if (!(isFinite(lat) && isFinite(lon) && lat && lon && S.loc.geoFor === addr)){
      const hit = await geocodeAddress(addr);
      if (!hit){
        S.loc = {...S.loc, status: "error", statusText: "Den Ort kenne ich nicht. Gib am besten nur den Ortsnamen ein, z. B. „Weikendorf“."};
        store.set("garten.loc", S.loc); render(); return;
      }
      lat = hit.latitude; lon = hit.longitude; label = hit.name;
    }
    const j = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=8&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum`);
    const d = j && j.daily; if (!d || !arr(d.time).length) throw new Error("keine Daten");
    const days = d.time.map((date, i) => {
      const sum = +d.precipitation_sum[i] || 0, pp = d.precipitation_probability_max[i];
      return {date, max: +d.temperature_2m_max[i], min: +d.temperature_2m_min[i], rainChance: pp == null ? (sum >= 2 ? 70 : sum >= .3 ? 35 : 5) : Math.round(+pp)};
    }).filter(x => isFinite(x.max) && isFinite(x.min));
    if (!days.length) throw new Error("keine Daten");
    if (S.loc.address !== addr) return;
    S.loc = {...S.loc, label, lat, lon, geoFor: addr, status: "ok", statusText: ""};
    S.weather = {days, stand: new Date().toISOString(), forAddress: addr, lat, now: j.current && isFinite(+j.current.temperature_2m) ? {temp: +j.current.temperature_2m, cond: wxCond(+j.current.weather_code)} : null};
    store.set("garten.loc", S.loc); store.set("garten.weather", S.weather);
    S.fireNote = ""; render(); renderSheet();
  } catch (e){
    if (!quiet || !weatherOk()) S.fireNote = "Keine Verbindung zum Wetterdienst. Sobald du Internet hast, tippe auf „Wetter jetzt aktualisieren“ (Reiter Wetter).";
    render();
  }
}
function weatherStale(){
  const age = S.weather && S.weather.stand ? Date.now() - new Date(S.weather.stand).getTime() : Infinity;
  return !weatherOk() || !(age < 3 * 36e5);
}

/* ---------- KI-Zugang mit eigenem Anthropic-API-Schlüssel ---------- */
const AI_MODEL = "claude-sonnet-5-5";
const aiKey = () => str(store.get("garten.apikey"));
function makeSample(){
  return {
    async limits(){ return {images: true}; },
    async json(prompt, opts){
      opts = opts || {};
      const content = [];
      for (const b of arr(opts.images)){
        const url = await blobToDataURL(b);
        content.push({type: "image", source: {type: "base64", media_type: b.type || "image/jpeg", data: String(url).split(",")[1] || ""}});
      }
      content.push({type: "text", text: prompt});
      let r;
      try {
        r = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST", signal: opts.signal,
          headers: {"content-type": "application/json", "x-api-key": aiKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
          body: JSON.stringify({model: AI_MODEL, max_tokens: 8000, messages: [{role: "user", content}]})
        });
      } catch (e){ throw {code: e && e.name === "AbortError" ? "cancelled" : "network"}; }
      if (r.status === 401 || r.status === 403) throw {code: "not_granted"};
      if (r.status === 429 || r.status === 529) throw {code: "rate_limited"};
      if (r.status === 400){
        let msg = ""; try { msg = JSON.stringify(await r.json()); } catch {}
        throw {code: /credit|balance|billing/i.test(msg) ? "not_granted" : /image/i.test(msg) ? "image_rejected" : "http_400"};
      }
      if (!r.ok) throw {code: "http_" + r.status};
      const j = await r.json();
      const txt = arr(j && j.content).map(c => (c && c.text) || "").join("");
      const m = txt.match(/\{[\s\S]*\}/); if (!m) throw {code: "invalid_json"};
      try { return JSON.parse(m[0]); } catch { throw {code: "invalid_json"}; }
    }
  };
}
async function saveKey(){
  const v = str(document.getElementById("key-in") && document.getElementById("key-in").value);
  if (!/^sk-ant-[A-Za-z0-9_-]{20,}$/.test(v)){ S.keyMsg = {ok: false, text: "Das sieht nicht nach einem Anthropic-Schlüssel aus. Er beginnt mit „sk-ant-“."}; renderSheet(); return; }
  S.keyMsg = {ok: true, text: "Schlüssel wird geprüft …"}; renderSheet();
  try {
    const r = await fetch("https://api.anthropic.com/v1/models?limit=1", {headers: {"x-api-key": v, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"}});
    if (r.status === 401 || r.status === 403){ S.keyMsg = {ok: false, text: "Anthropic lehnt diesen Schlüssel ab. Prüfe, ob du ihn vollständig kopiert hast."}; renderSheet(); return; }

const cut = (s, n) => { s = str(s); return s.length > n ? s.slice(0, n - 1).trim() + "…" : s; };
function morningText(){
  const t = todayKey(), base = dailySummary(S.plants, t, shopOpen().length).split("\n"), m = parseKey(t).getMonth(), tips = [];
  S.plants.forEach(p => { const j = p.plan && arr(p.plan.jetzt)[0]; if (j) tips.push(`${p.name}: ${cut(j, 120)}`); });
  if (!tips.length){
    if (S.plants.some(isLawn)) tips.push("Rasen: " + cut(CAL[m].r, 130));
    if (S.plants.some(p => p.area === "beet")) tips.push("Gemüse: " + cut(CAL[m].g, 130));
    if (S.plants.some(p => p.area === "kuebel" || (AREAS[p.area] || {}).indoor)) tips.push("Kübel & Drinnen: " + cut(CAL[m].k, 130));
  }
  return {title: base[0], text: base.slice(1).concat(tips.slice(0, 3)).join("\n")};
}
let syncT;
function syncSummary(){
  clearTimeout(syncT);
  syncT = setTimeout(() => {
    const a = AND(); if (!a || typeof a.saveSummary !== "function" || S.mode !== "local") return;
    try { prepWeather(); const m = S.plants.length ? morningText() : {title: "", text: ""}; a.saveSummary(todayKey(), m.title || "", m.text || ""); } catch {}
  }, 1500);
}
function testNow(){ const a = AND(); if (a){ syncSummary(); a.testNow(); toast("Test läuft – die Nachricht kommt in wenigen Sekunden"); } }
/* Aufruf aus Android, wenn die Morgen-Nachricht erzeugt wird (ohne sichtbare Oberfläche) */
window.__morning = async function(){
  try {
    if (S.mode === "loading") goLocal();
    if (S.loc && S.loc.address && S.loc.status !== "error" && weatherStale()) await Promise.race([loadWeatherOM(true), new Promise(r => setTimeout(r, 3500))]);
    prepWeather();
    return JSON.stringify(S.plants.length ? morningText() : {});
  } catch (e){ return "{}"; }
};
window.__remChanged = () => { if (S.sheet && S.sheet.type === "settings") renderSheet(); };
document.addEventListener("change", e => {
  const t = e.target, a = AND(); if (!a || (t.id !== "rem-on" && t.id !== "rem-time")) return;
  const on = document.getElementById("rem-on").checked, tm = (document.getElementById("rem-time").value || "07:00").split(":");
  if (on && a.needsPermission()) a.requestNotificationPermission();
  a.setReminder(on, +tm[0] || 7, +tm[1] || 0);
  syncSummary(); setTimeout(renderSheet, 300);
});

    if (same.length) out.push({k: "warn", t: `Letztes Jahr wuchs hier: ${FAM[it.prev]}. ${same.map(k => CROPS[k].n).join(" und ")} ${same.length > 1 ? "gehören" : "gehört"} zur selben Familie. Das fördert Krankheiten und Bodenmüdigkeit, besser 3 bis 4 Jahre Pause.`});
    else out.push({k: "ok", t: "Fruchtfolge passt: andere Familie als letztes Jahr."});
  }
  if (bed){
    const sh = mapShade(it);
    if (sh.f >= .08) out.push({k: sh.f >= .35 ? "warn" : "info", t: `Etwa ${Math.round(sh.f * 100)} % der Fläche liegen im Schatten von „${sh.by}“ (grobe Schätzung für Frühjahr und Herbst, Höhen angenommen).`});
    else if (MAP().items.some(c => gkHeight(c) > 0)) out.push({k: "ok", t: "Kaum Schatten durch Haus, Bäume oder Hütte. Voll sonnig."});
    const need = keys.filter(k => CROPS[k].sun === "v");
    if (sh.f >= .35 && need.length) out.push({k: "warn", t: `${need.map(k => CROPS[k].n).join(", ")} brauchen volle Sonne. Hier wird der Ertrag geringer ausfallen.`});
    const z = [...new Set(keys.map(k => CROPS[k].z))];
    if (z.includes("s") && z.includes("w")) out.push({k: "info", t: "Starkzehrer und Schwachzehrer im selben Beet: düngen nach den Starkzehrern, Schwachzehrer brauchen weniger."});
  }
  return out;
}

/* ----- Ziehen und Größe ändern ----- */
let mdrag = null;
document.addEventListener("pointerdown", e => {
  const t = e.target; if (!t || !t.closest) return;
  const cv = document.getElementById("gk-cv"), hnd = t.closest("[data-mh]"), el = hnd || t.closest("[data-mid]");
  S.mapBlank = !!cv && t === cv;
  if (!el || !cv || !cv.contains(el)) return;
  const id = el.dataset.mh || el.dataset.mid, it = mapItem(id); if (!it) return;
  mdrag = {id, mode: hnd ? "size" : "move", sx: e.clientX, sy: e.clientY, ox: it.x, oy: it.y, ow: it.w, oh: it.h, moved: false, pid: e.pointerId, ppm: mapPpm()};
  try { cv.setPointerCapture(e.pointerId); } catch {}
  if (S.mapSel !== id) mapSelect(id);
});
document.addEventListener("pointermove", e => {
  if (!mdrag || e.pointerId !== mdrag.pid) return;
  if (!mdrag.moved && Math.hypot(e.clientX - mdrag.sx, e.clientY - mdrag.sy) < 6) return;
  mdrag.moved = true;
  const it = mapItem(mdrag.id), m = MAP(); if (!it){ mdrag = null; return; }
  const dx = (e.clientX - mdrag.sx) / mdrag.ppm, dy = (e.clientY - mdrag.sy) / mdrag.ppm;
  if (mdrag.mode === "move"){
    it.x = r1(clamp(mdrag.ox + dx, 0, Math.max(0, m.w - it.w)));
    it.y = r1(clamp(mdrag.oy + dy, 0, Math.max(0, m.l - it.h)));
  } else {
    it.w = r1(clamp(mdrag.ow + dx, .2, Math.max(.2, m.w - it.x)));
    it.h = r1(clamp(mdrag.oh + dy, .2, Math.max(.2, m.l - it.y)));
  }
  gkUpdateItem(it);
});
function mapDragEnd(e){
  if (!mdrag || (e && e.pointerId != null && e.pointerId !== mdrag.pid)) return;
  const was = mdrag; mdrag = null;
  if (was.moved){ mapSave(); mapRedraw(); }
}
document.addEventListener("pointerup", mapDragEnd);
document.addEventListener("pointercancel", mapDragEnd);
document.addEventListener("lostpointercapture", mapDragEnd);
document.addEventListener("click", e => {
  if (e.target && e.target.id === "gk-cv" && S.mapBlank && S.mapSel){ mapSelect(null); }
});
document.addEventListener("scroll", e => { const t = e.target; if (t && t.id === "mapbox") S.mapScroll = [t.scrollLeft, t.scrollTop]; }, true);
let mapRW = 0, mapRT;
window.addEventListener("resize", () => {
  clearTimeout(mapRT);
  mapRT = setTimeout(() => { const w = document.documentElement.clientWidth; if (w !== mapRW){ mapRW = w; if (!mdrag) mapRefresh(); } }, 200);
});

/* ----- Aktionen ----- */
function mapAct(a, b){
  const id = b.dataset.id, m = MAP();
  switch (a){
    case "gview": S.gview = b.dataset.v === "karte" ? "karte" : "liste"; store.set("garten.gview", S.gview); S.mapSel = null; render(); break;
    case "map-sel": S.mapSel = id; render(); window.scrollTo(0, 0); break;
    case "map-desel": mapSelect(null); break;
    case "map-open": S.gview = "karte"; store.set("garten.gview", "karte"); setTab("garten"); break;
    case "map-add": openSheet({type: "mapadd"}); break;
    case "map-new": { S.sheetErr = "";
      const t = b.dataset.type, d = MTYPES[t]; if (!d || !mapHasLot()) break;
      const n = m.items.filter(i => i.type === t).length;
      const it = mapNormItem({type: t, name: n ? d.l + " " + (n + 1) : d.l, x: (m.w - d.w) / 2 + Math.min(n, 6) * .5, y: (m.l - d.h) / 2 + Math.min(n, 6) * .5, w: d.w, h: d.h}, m);
      m.items.push(it); mapSave(); S.mapSel = it.id; render(); openSheet({type: "mapitem", id: it.id}); break; }
    case "map-edit": S.sheetErr = ""; openSheet({type: "mapitem", id}); break;
    case "map-dup": {
      const o = mapItem(id); if (!o) break;
      const base = (o.name || MTYPES[o.type].l).replace(/\s*\(Kopie\)/g, "").replace(/\s+\d+$/, "").trim();
      let k = 2; while (m.items.some(i => i.name === base + " " + k)) k++;
      const c = mapNormItem({...o, id: "", pids: o.pids.slice(), pl: o.pl.slice(), name: base + " " + k, x: Math.min(o.x + .5, m.w - o.w), y: Math.min(o.y + .5, m.l - o.h)}, m);
      m.items.push(c); mapSave(); S.mapSel = c.id; render(); break; }
    case "map-zoom": {
      const box = document.getElementById("mapbox"), cw = box ? box.scrollWidth : 0;
      const fx = box && cw ? (box.scrollLeft + box.clientWidth / 2) / cw : 0, fy = box && box.scrollHeight ? (box.scrollTop + box.clientHeight / 2) / box.scrollHeight : 0;
      const z = [1, 1.5, 2, 3, 4], i = Math.max(0, z.indexOf(S.mapZoom || 1)) + (+b.dataset.d || 0);
      S.mapZoom = z[clamp(i, 0, z.length - 1)]; render();
      const nb = document.getElementById("mapbox");
      if (nb){ nb.scrollLeft = fx * nb.scrollWidth - nb.clientWidth / 2; nb.scrollTop = fy * nb.scrollHeight - nb.clientHeight / 2; S.mapScroll = [nb.scrollLeft, nb.scrollTop]; }
      break; }
    case "map-lot": S.sheetErr = ""; openSheet({type: "maplot"}); break;
    case "map-lot-first": {
      const w = numIn(document.getElementById("ml-w").value), l = numIn(document.getElementById("ml-l").value);
      if (!(w >= 1 && l >= 1 && w <= 2000 && l <= 2000)){ S.mapErr = "Bitte Breite und Länge in Metern eintragen, z. B. 20 und 35."; render(); break; }
      S.mapErr = ""; S.mapDraft = null; m.w = r2(w); m.l = r2(l); mapSave(); render(); break; }
    case "map-lot-save": mapSaveLot(); break;
    case "map-clear": S.sheet.confirmClear = true; renderSheet(); break;
    case "map-clear-no": S.sheet.confirmClear = false; renderSheet(); break;
    case "map-clear-yes": S.map = mapNormalize({}); mapSave(); S.mapSel = null; closeSheet(); render(); toast("Karte geleert"); break;
    case "map-import": mapImport(); break;
    case "map-item-save": mapSaveItem(); break;
    case "map-item-del": S.sheet.confirmDelete = true; renderSheet(); break;
    case "map-item-del-no": S.sheet.confirmDelete = false; renderSheet(); break;
    case "map-item-del-yes": m.items = m.items.filter(i => i.id !== S.sheet.id); mapSave(); S.mapSel = null; closeSheet(); render(); toast("Gelöscht"); break;
    case "map-ai": S.mapAiDone = null; S.mapErr = ""; openSheet({type: "mapai"}); break;
    case "map-ai-go": mapAI(); break;
    case "map-ai-stop": S.mapCtl && S.mapCtl.abort(); break;
  }
}
const mapFields = (ids) => ids.map(i => document.getElementById(i));
function mapSaveItem(){
  const it = mapItem(S.sheet.id), m = MAP(); if (!it) return;
  const v = id => { const e = document.getElementById(id); return e ? e.value : ""; };
  const w = numIn(v("mi-w")), h = numIn(v("mi-h")), x = numIn(v("mi-x")), y = numIn(v("mi-y"));
  let err = "";
  if (!(w >= .1 && h >= .1)) err = "Breite und Länge müssen mindestens 0,1 m sein.";
  else if (!(x >= 0 && y >= 0)) err = "Der Abstand von links und oben darf nicht negativ sein.";
  else if (x + w > m.w + .001) err = `Das Element ist zu breit: ${fm(x)} m Abstand plus ${fm(w)} m Breite sind mehr als die Grundstücksbreite von ${fm(m.w)} m.`;
  else if (y + h > m.l + .001) err = `Das Element ist zu lang: ${fm(y)} m Abstand plus ${fm(h)} m Länge sind mehr als die Grundstückslänge von ${fm(m.l)} m.`;
  if (err){ S.sheetErr = err; renderSheet(); return; }
  const pids = Array.from(document.querySelectorAll(".gk-pl:checked")).map(e => e.value);
  const pl = Array.from(document.querySelectorAll(".gk-cp:checked")).map(e => e.value);
  Object.assign(it, mapNormItem({id: it.id, type: v("mi-type"), name: v("mi-name"), x, y, w, h, crops: v("mi-crops"), pids, note: v("mi-note"), pl, prev: v("mi-prev")}, m));
  mapSave(); S.sheetErr = ""; S.mapSel = it.id; closeSheet(); render(); toast("Gespeichert");
}
function mapSaveLot(){
  const m = MAP(), w = numIn(document.getElementById("mls-w").value), l = numIn(document.getElementById("mls-l").value);
  if (!(w >= 1 && l >= 1 && w <= 2000 && l <= 2000)){ S.sheetErr = "Bitte Breite und Länge in Metern eintragen."; renderSheet(); return; }
  m.w = r2(w); m.l = r2(l); m.north = +document.getElementById("mls-n").value || 0;
  m.items = m.items.map(i => mapNormItem(i, m));
  mapSave(); S.sheetErr = ""; closeSheet(); render(); toast("Gespeichert");
}
function mapImport(){
  const t = str(document.getElementById("mapimp").value);
  try {
    const o = JSON.parse(t), n = mapNormalize(o);
    if (!(n.w > 0 && n.l > 0)) throw new Error("lot");
    S.map = n; mapSave(); S.mapSel = null; S.sheetErr = ""; closeSheet(); render(); toast(`${n.items.length} Elemente übernommen`);
  } catch { S.sheetErr = "Das konnte ich nicht lesen. Füge den kompletten Text ein, der mit { beginnt und mit } endet."; renderSheet(); }
}

      <div class="btn-row"><button class="btn sm" data-act="map-import">Karte laden</button></div>
    </div>
    ${S.sheet.confirmClear ? `<div class="confirm"><span>Alle ${m.items.length} Elemente und das Grundstück löschen?</span><div class="btn-row"><button class="btn danger" data-act="map-clear-yes">Endgültig leeren</button><button class="btn ghost" data-act="map-clear-no">Abbrechen</button></div></div>`
      : `<button class="btn ghost" data-act="map-clear" style="align-self:flex-start;color:var(--bad)">Karte leeren</button>`}`;
}
function mapAiSheet(head){
  const m = MAP(), done = S.mapAiDone;
  return `${head("Per Text eintragen")}
    <p class="muted small" style="margin:0">Beschreibe in eigenen Worten, was wo ist. Claude zeichnet es auf die Karte. Du kannst alles danach noch verschieben und anpassen.</p>
    ${!S.sample ? `<div class="banner">Dafür brauchst du den API-Schlüssel.${BTN_SETTINGS}</div>` : ""}
    <div class="field"><label for="mapai-in">Beschreibung</label><textarea id="mapai-in" style="min-height:150px" placeholder="${esc(mapHasLot() ? "z. B. Hochbeet 1,2 × 2,4 m hinten links mit Tomaten und Paprika. Daneben ein Kräuterbeet 1 × 1 m. Apfelbaum ganz rechts, Durchmesser 4 m." : "z. B. Grundstück 20 × 35 m. Das Haus steht vorne, 12 × 9 m, in der Mitte. Dahinter Terrasse 5 × 4 m, hinten links ein Gemüsebeet 3 × 1,2 m mit Tomaten.")}" ${S.mapBusy ? "disabled" : ""}>${esc(S.mapAiDraft || "")}</textarea><p class="hint">Je genauer die Maße und Himmelsrichtungen („links hinten“, „neben der Terrasse“), desto besser. Bereits Eingetragenes bleibt unverändert.</p></div>
    ${S.mapBusy ? `<div class="busy"><span class="leafspin">${GL.sprout}</span><div><b>Die Karte wird gezeichnet …</b><div class="muted small">Das dauert meist 10–30 Sekunden.</div></div></div><div class="btn-row"><button class="btn ghost sm" data-act="map-ai-stop">Abbrechen</button></div>` : ""}
    ${S.mapErr ? `<div class="err">${esc(S.mapErr)}</div>` : ""}
    ${done ? `<div class="banner"><b>${done.n} Element${done.n === 1 ? "" : "e"} eingetragen.</b>${done.note ? "<br>" + esc(done.note) : ""}<br><button class="btn sm" data-act="close" style="margin-top:8px">Karte ansehen</button></div>` : ""}
    ${S.sample && !S.mapBusy ? `<div class="btn-row"><button class="btn primary" data-act="map-ai-go">${I.spark}Auf die Karte eintragen</button></div>` : ""}`;
}
const BTN_SETTINGS = '<br><button class="btn sm" data-act="settings" style="margin-top:8px">Einstellungen öffnen</button>';

/* ----- KI: Text in Kartenelemente umsetzen ----- */
function mapPrompt(txt){
  const m = MAP();
  const have = m.items.map(i => ({typ: i.type, name: i.name, x: i.x, y: i.y, breite: i.w, laenge: i.h}));
  return `Du hilfst beim Zeichnen einer Gartenkarte in der Draufsicht. Alle Maße sind in Metern. Der Ursprung (0, 0) ist die obere linke Ecke des Grundstücks, x wächst nach rechts, y nach unten.
${mapHasLot() ? `Das Grundstück ist ${m.w} m breit (x) und ${m.l} m lang (y).` : "Das Grundstück ist noch nicht eingetragen. Entnimm Breite und Länge aus der Beschreibung."}
Erlaubte Typen: ${Object.keys(MTYPES).join(", ")}.
Erlaubte Pflanzen-Schlüssel für "pflanzen": ${CROP_KEYS.join(", ")}.
Bereits vorhandene Elemente (nicht ändern, nur beachten): ${JSON.stringify(have)}

Der Gärtner beschreibt, was neu eingetragen werden soll:
"""
${txt}
"""

Antworte NUR mit einem JSON-Objekt in genau dieser Form:
{"grundstueck": {"breite": Zahl, "laenge": Zahl} oder null,
 "neu": [{"typ": "beet", "name": "Kurzer Name", "x": Zahl, "y": Zahl, "breite": Zahl, "laenge": Zahl, "bepflanzung": "nur Pflanzen, die nicht in der Liste stehen", "pflanzen": ["tomate", "paprika"]}],
 "hinweis": "Ein kurzer Satz, was du schätzen musstest oder was unklar blieb. Leer, wenn alles klar war."}

Regeln:
- "grundstueck" nur setzen, wenn das Grundstück noch nicht eingetragen ist und die Beschreibung die Maße nennt, sonst null.
- x und y sind die linke obere Ecke des Elements. Jedes neue Element liegt vollständig im Grundstück (x + breite höchstens Grundstücksbreite, y + laenge höchstens Grundstückslänge).
- Ohne andere Angabe ist oben (kleines y) hinten und unten (großes y) vorne zur Straße. Links und rechts sind wie auf dem Bildschirm.
- Nenne Maße, die der Gärtner nicht angegeben hat, realistisch geschätzt und erwähne das im Hinweis.
- Bäume, Sträucher und Einzelpflanzen haben gleiche breite und laenge (Durchmesser).
- Neue Elemente überlappen nicht mit bereits vorhandenen, außer Beete oder Terrassen liegen auf Rasen.
- "pflanzen" enthält nur Schlüssel aus der Liste für das, was der Gärtner pflanzt oder gepflanzt hat. "bepflanzung" nennt nur, was nicht in der Liste steht. Erfinde nichts dazu.`;
}
async function mapAI(){
  const txt = str((document.getElementById("mapai-in") || {}).value || S.mapAiDraft);
  S.mapAiDraft = txt;
  if (!txt || !S.sample || S.mapBusy) return;
  S.mapBusy = true; S.mapErr = ""; S.mapAiDone = null; S.mapCtl = new AbortController(); renderSheet();
  try {
    const r = await S.sample.json(mapPrompt(txt), {signal: S.mapCtl.signal});
    const m = MAP(), g = r && r.grundstueck;
    if (!mapHasLot()){
      const w = numIn(g && g.breite), l = numIn(g && g.laenge);
      if (!(w >= 1 && l >= 1)) throw {code: "no_lot"};
      m.w = r2(w); m.l = r2(l);
    }
    const added = arr(r && r.neu).filter(x => x && typeof x === "object").slice(0, 60).map(x => mapNormItem({type: x.typ, name: x.name, x: x.x, y: x.y, w: x.breite, h: x.laenge, crops: x.bepflanzung, pl: arr(x.pflanzen)}, m));
    if (!added.length) throw {code: "invalid_json"};
    m.items = m.items.concat(added); mapSave();
    S.mapAiDone = {n: added.length, note: str(r.hinweis)}; S.mapAiDraft = "";
    S.gview = "karte"; store.set("garten.gview", "karte");
  } catch (e){
    const c = e && e.code;
    S.mapErr = c === "cancelled" ? "" : c === "not_granted" ? "Der API-Schlüssel fehlt, wird abgelehnt oder das Guthaben ist aufgebraucht. Prüfe ihn in den Einstellungen." : c === "rate_limited" ? "Gerade zu viele Anfragen. Probier es in einer Minute nochmal." : c === "network" ? "Keine Verbindung. Prüfe dein Internet und versuche es nochmal." : c === "no_lot" ? "Ich konnte die Größe des Grundstücks nicht erkennen. Nenne Breite und Länge in Metern, z. B. „Grundstück 20 × 35 m“." : "Das hat nicht geklappt. Beschreibe es bitte etwas genauer und versuche es nochmal.";
  } finally { S.mapBusy = false; S.mapCtl = null; renderSheet(); render(); }
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "ml-w" || t.id === "ml-l") S.mapDraft = {...(S.mapDraft || {}), [t.id === "ml-w" ? "w" : "l"]: t.value};
  if (t.id === "mapai-in") S.mapAiDraft = t.value;
});

/* ---------- boot ---------- */
function goLocal(){
  if (S.mode !== "loading") return;
  S.mode = "local"; S.plants = store.get("garten.plants") || []; S.loc = store.get("garten.loc") || null;
  S.shop = store.get("garten.shop") || []; S.harvests = store.get("garten.harvests") || []; S.bedplan = store.get("garten.bedplan") || null; S.weather = store.get("garten.weather") || null; S.map = mapNormalize(store.get("garten.map")); S.gview = store.get("garten.gview") === "karte" ? "karte" : "liste"; S.sample = aiKey() ? makeSample() : null; S.imgOk = !!S.sample; render(); maybeRefreshWeather();
}
async function boot(){
  render();
  if (!window.claude || typeof window.claude.use !== "function"){ goLocal(); return; }
  claude.use("sample").then(async s => {
    S.sample = s;
    if (s){ try { const l = await s.limits(); S.imgOk = !!(l && l.images); } catch { S.imgOk = false; } }
    render();
  }).catch(() => {});
  claude.use("assets").then(a => { S.assets = a; }).catch(() => {});
  claude.use("mcp").then(m => { S.mcp = m; }).catch(() => {});
  let db = null; try { db = await claude.use("db"); } catch {}
  if (!db){ goLocal(); return; }
  S.db = db;
  let gotPlants = false, gotLoc = false;
  const ready = () => { if (gotPlants && gotLoc && S.mode === "loading") S.mode = "db"; render(); };
  db.collection("plants").onSnapshot(snap => {
    gotPlants = true;
    S.plants = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => String(a.name).localeCompare(String(b.name), "de"));
    ready();
  }, () => { goLocal(); toast("Gartenbuch nicht erreichbar – lokal gespeichert."); });
  db.doc("settings/location").onSnapshot(snap => {
    gotLoc = true;
    S.loc = snap.exists ? snap.data() : null;
    ready();
  }, () => { gotLoc = true; ready(); });
  db.doc("weather/current").onSnapshot(snap => { S.weather = snap.exists ? snap.data() : null; render(); }, () => {});
  db.collection("shopping").onSnapshot(snap => { S.shop = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => String(a.created) < String(b.created) ? -1 : 1); render(); }, () => {});
  db.collection("harvests").onSnapshot(snap => { S.harvests = snap.docs.map(d => ({id: d.id, ...d.data()})); render(); }, () => {});
  db.doc("settings/bedplan").onSnapshot(snap => { S.bedplan = snap.exists ? snap.data() : null; render(); }, () => {});
}
boot();
})();
</script>
